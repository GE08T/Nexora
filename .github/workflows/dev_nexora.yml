name: Build and deploy PHP app to Azure Web App

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "NEXORA"    # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'  # Set this to the path to your web app project, defaults to the repository root
  PHP_VERSION: '8.2'             # Specify a precise PHP version (e.g., 8.0 or 8.1)

permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Sesuaikan dengan versi PHP Anda

    # <-- PENTING 1: Install dependensi Composer
    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader
      # --no-dev: Hanya install package untuk produksi.
      # --optimize-autoloader: Mengoptimalkan class autoloader untuk performa.

    # <-- PENTING 2: Install dependensi Node.js & Build Aset Frontend
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # Sesuaikan dengan versi Node.js Anda
    - name: Install NPM Dependencies & Build Assets
      run: |
        npm install
        npm run build
      # npm install: Menginstall package dari package.json.
      # npm run build: Meng-compile file CSS/JS untuk produksi.

    # <-- PENTING 3: Buat file .env dari GitHub Secrets
    - name: Create .env file
      run: |
        echo "${{ secrets.DOT_ENV }}" > .env
        php artisan key:generate --force
      # Salin semua isi file .env produksi Anda ke dalam sebuah Secret di GitHub.
      # Nama secret di sini contohnya adalah DOT_ENV.

    # <-- PENTING 4: Optimasi Laravel untuk Produksi
    - name: Optimize Laravel
      run: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'NEXORA' # Ganti dengan nama App Service Anda
        slot-name: 'production'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }} # Ini biasanya sudah dibuat otomatis
        package: .

    # <-- OPSIONAL TAPI DIANJURKAN: Jalankan Migrasi Database
    # Cara ini lebih aman daripada menggunakan Startup Command di Azure.
    - name: Run database migrations
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AZURE_WEBAPP_HOSTNAME }}
        username: ${{ secrets.AZURE_WEBAPP_USERNAME }}
        password: ${{ secrets.AZURE_WEBAPP_PASSWORD }}
        port: 22
        script: |
          cd /home/site/wwwroot
          php artisan migrate --force
          php artisan db:seed --force